<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Conteúdo do site | Área restrita ECC Bom Pastor</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h2>ECC Bom Pastor</h2>
      <div class="user-info" id="user-info">Carregando…</div>
      <nav id="sidebar-nav"></nav>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </aside>
    <main class="content">
      <h1>Conteúdo do site</h1>

      <section class="card" id="encontro-card">
        <h3>Próximo encontro</h3>
        <form id="encontro-form">
          <label for="e-data">Texto da data</label>
          <input type="text" id="e-data" placeholder="Próximo encontro · 2026" />
          <label for="e-local">Local</label>
          <input type="text" id="e-local" />
          <label for="e-preco">Preço</label>
          <input type="text" id="e-preco" />
          <label for="e-parcelamento">Parcelamento</label>
          <input type="text" id="e-parcelamento" />
          <label for="e-link">Link de inscrição (Google Forms)</label>
          <input type="url" id="e-link" />
          <button type="submit" class="btn-primary" style="width:auto; margin-top:1rem;">Salvar</button>
          <div class="ok-msg" id="encontro-msg"></div>
        </form>
      </section>

      <section class="card" id="contato-card">
        <h3>Canal de contato</h3>
        <form id="contato-form">
          <label for="c-whatsapp">WhatsApp</label>
          <input type="text" id="c-whatsapp" placeholder="(11) 99999-9999" />
          <label for="c-email">E-mail</label>
          <input type="email" id="c-email" />
          <button type="submit" class="btn-primary" style="width:auto; margin-top:1rem;">Salvar</button>
          <div class="ok-msg" id="contato-msg"></div>
        </form>
      </section>

      <section class="card" id="depoimentos-card">
        <div class="toolbar">
          <h3>Depoimentos</h3>
          <button class="btn-secondary" id="new-dep-btn">+ Novo depoimento</button>
        </div>

        <div class="card hidden" id="dep-form-card" style="box-shadow:none; border:1px solid #d9dee3;">
          <form id="dep-form">
            <input type="hidden" id="dep-id" />
            <label for="dep-nome">Nome do casal</label>
            <input type="text" id="dep-nome" required />
            <label for="dep-texto">Depoimento</label>
            <textarea id="dep-texto" rows="4" required></textarea>
            <label for="dep-video">Link do vídeo no YouTube (opcional)</label>
            <input type="url" id="dep-video" placeholder="https://www.youtube.com/watch?v=..." />
            <div id="dep-video-preview" class="hidden" style="margin-top:.6rem; position:relative; width:100%; max-width:360px; padding-bottom:56.25%; height:0; border-radius:8px; overflow:hidden;"></div>
            <div class="error-msg" id="dep-video-msg"></div>
            <label><input type="checkbox" id="dep-autorizado" style="width:auto; display:inline;" /> Casal autorizou a publicação</label>
            <label><input type="checkbox" id="dep-publicado" style="width:auto; display:inline;" /> Publicado no site</label>
            <div style="margin-top:1rem; display:flex; gap:.6rem;">
              <button type="submit" class="btn-primary" style="width:auto;">Salvar</button>
              <button type="button" class="btn-secondary" id="dep-cancel-btn">Cancelar</button>
            </div>
            <div class="error-msg" id="dep-form-msg"></div>
          </form>
        </div>

        <table>
          <thead><tr><th>Casal</th><th>Vídeo</th><th>Autorizado</th><th>Publicado</th><th></th></tr></thead>
          <tbody id="dep-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="/admin/js/common.js"></script>
  <script src="/admin/js/conteudo.js"></script>
</body>
</html>
